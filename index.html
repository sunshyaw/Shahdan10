<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دەزگای شەهیدان - پۆرتاڵی پێشکەشکردنی زانکۆ</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            max-width: 550px;
            width: 100%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            border-top: 6px solid #1b4f72;
        }
        .welcome-box {
            background-color: #eaf2f8;
            border-right: 4px solid #1b4f72;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            line-height: 1.7;
            font-size: 15px;
        }
        .step {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }
        .step.active {
            display: block;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
            color: #1b4f72;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            height: 90px;
        }
        button {
            background-color: #1b4f72;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #154360;
        }
        .result-box {
            display: none;
            background-color: #fdedec;
            border: 2px solid #c0392b;
            color: #922b21;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            line-height: 1.8;
            font-size: 16px;
        }
        .result-box h3 {
            margin-top: 0;
            color: #c0392b;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="welcome-box">
        <strong>سڵاو بەڕێز، بەخێربێیت بۆ دەزگای شەهیدان.</strong><br>
        ئێوە کەسوکاری سەربەرزی شەهیدانن؛ ئێوە تاجی سەری ئەم نیشتمانەن و هەمیشە جێگەی شانازی و ڕێز و پێزانینی ئێمەن. خوێنی پاکی شەهیدەکانتان بووە هەوێنی ئازادی و سەرفرازی ئەمڕۆمان، خزمەتکردنی ئێوەش بچووکترین ئەرکی سەرشانمانە.
    </div>

    <form id="martyrsForm">
        <!-- هەنگاوی ١: ناو -->
        <div class="step active" id="step1">
            <label for="fullName">تکایە ناوی سیانیت بنووسە:</label>
            <input type="text" id="fullName" name="ناوی_بەکارهێنەر" placeholder="نموونە: ئەحمەد محەمەد عەلی" required>
            <button type="button" onclick="nextStep(1, 2)">دواتر</button>
        </div>

        <!-- هەنگاوی ٢: دەرەجە -->
        <div class="step" id="step2">
            <label for="grade">تکایە دەرەجەکەت (کۆنمرە) بنووسە:</label>
            <input type="number" step="0.01" id="grade" name="دەرەجە" placeholder="نموونە: 85.5" required>
            <button type="button" onclick="nextStep(2, 3)">دواتر</button>
        </div>

        <!-- هەنگاوی ٣: بەشەکان -->
        <div class="step" id="step3">
            <label for="department">بەشەکان هەڵبژێرە کە داوای دەکەیت:</label>
            <select id="department" name="بەشی_داواکراو" required>
                <option value="">-- بەشێک هەڵبژێرە --</option>
                <option value="پزیشکی گشتی">پزیشکی گشتی</option>
                <option value="پزیشکی ددان">پزیشکی ددان</option>
                <option value="دەرمانسازی">دەرمانسازی</option>
                <option value="ئەندازیاری">ئەندازیاری</option>
                <option value="زانستی کۆمپیوتەر و زیرەکی دەستکرد">زانستی کۆمپیوتەر و زیرەکی دەستکرد</option>
                <option value="یاسا و ڕامیاری">یاسا و ڕامیاری</option>
                <option value="کارگێڕی و ئابووری">کارگێڕی و ئابووری</option>
                <option value="پەروەردە">پەروەردە</option>
            </select>
            <button type="button" onclick="nextStep(3, 4)">دواتر</button>
        </div>

        <!-- هەنگاوی ٤: وتە بۆ شەهید -->
        <div class="step" id="step4">
            <label for="messageForMartyr">چیتان هەیە بۆ شەهیدەکەتان؟</label>
            <textarea id="messageForMartyr" name="وتە_بۆ_شەهید" placeholder="وتە و پەیامی خۆتان لێرە بنووسن..." required></textarea>
            <button type="button" onclick="nextStep(4, 5)">دواتر</button>
        </div>

        <!-- هەنگاوی ٥: هەستت چۆنە -->
        <div class="step" id="step5">
            <label for="feeling">هەستت چۆنە؟</label>
            <textarea id="feeling" name="هەستی_بەکارهێنەر" placeholder="هەستی خۆت دەرببڕە..." required></textarea>
            <button type="submit" id="submitBtn">ناردنی داواکاری</button>
        </div>
    </form>

    <!-- ئەنجامی کۆتایی -->
    <div class="result-box" id="resultBox">
        <h3>ئاگاداری ئەنجامی وەرگرتن</h3>
        <p id="resultText"></p>
    </div>
</div>

<script>
    const FORMSPREE_URL = "https://formspree.io/f/xljbzajl";

    function nextStep(current, next) {
        const currentDiv = document.getElementById("step" + current);
        const input = currentDiv.querySelector("input, select, textarea");
        
        if (!input.value.trim()) {
            alert("تکایە سەرەتا ئەم خانەیە پڕ بکەرەوە!");
            input.focus();
            return;
        }
        
        currentDiv.classList.remove("active");
        document.getElementById("step" + next).classList.add("active");
    }

    document.getElementById("martyrsForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.innerText = "چاوەڕوان بە...";

        const formData = new FormData(this);
        const deptName = document.getElementById("department").value;

        try {
            await fetch(FORMSPREE_URL, {
                method: "POST",
                body: formData,
                headers: { 'Accept': 'application/json' }
            });
        } catch (error) {
            console.error("کێشە لە ناردنی ئیمەیڵ:", error);
        }

        document.getElementById("martyrsForm").style.display = "none";
        const resultBox = document.getElementById("resultBox");
        const resultText = document.getElementById("resultText");

        resultText.innerHTML = `بەڕێز <strong>${document.getElementById("fullName").value}</strong>،<br>
        سەبارەت بە هاتنەوەی ناوت لە بەشی <strong>(${deptName})</strong>؛ ئاگادارتان دەکەینەوە کە بەداخەوە لە ئێستادا ئەو ژمارە کورسییەی کە داوای دەکەیت بۆ زانکۆ <strong>پڕ بووەتەوە و داخراوە</strong>.`;

        resultBox.style.display = "block";
    });
</script>

</body>
</html>
